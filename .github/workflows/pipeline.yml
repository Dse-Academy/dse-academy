# Coleta semanal de vagas e publicação do portal no GitHub Pages.
#
# Configuração no GitHub (uma vez):
#   Settings > Pages > Source: GitHub Actions
#   Settings > Secrets and variables > Actions > Variables:
#     SUPABASE_URL, SUPABASE_ANON_KEY (chave publishable: é pública por design)
#     PRIVACIDADE_RESPONSAVEL, PRIVACIDADE_CONTATO, PRIVACIDADE_REGIAO_DADOS
#     (exibidas na política de privacidade; vazias aparecem como "[a definir]")
#
# Além do site antigo (GitHub Pages), o job "dados-do-site-novo" regenera apps/web/data/ (vagas e trilhas do site novo)
# e commita no main: a Vercel publica sozinha a cada commit. Opcional: o segredo GROQ_API_KEY (Settings > Secrets > Actions)
# faz o modelo aberto organizar as trilhas; sem ele, as trilhas saem por regras.
#
# Proteção da main: quando a main exige PR e checks verdes, o commit de dados precisa de uma identidade com bypass.
# O job usa a chave de deploy do secret DEPLOY_KEY (permitida como bypass na regra da main). Sem o secret, o checkout
# cai no GITHUB_TOKEN, que só consegue gravar enquanto a main NÃO exige PR.
#
# Se a coleta vier suspeita (poucas vagas) ou os testes falharem, nada é publicado:
# o site anterior continua no ar e o GitHub avisa por e-mail.

name: Coleta e publicação

on:
  schedule:
    # Sexta às 05:00 UTC = 02:00 em Brasília (madrugada de quinta para sexta).
    # O GitHub pode atrasar execuções agendadas em alguns minutos.
    - cron: "0 5 * * 5"
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write # o job dados-do-site-novo commita apps/web/data/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coletar-e-construir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Coletar vagas da Gupy
        run: python -m ingestion.gupy --minimo 200

      - name: Guardar o JSON bruto da coleta (90 dias)
        uses: actions/upload-artifact@v7
        with:
          name: coleta-gupy-${{ github.run_id }}
          path: data/raw/
          retention-days: 90

      - name: Gerar o site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          AUTH_PROVEDORES: ${{ vars.AUTH_PROVEDORES }}
          PRIVACIDADE_RESPONSAVEL: ${{ vars.PRIVACIDADE_RESPONSAVEL }}
          PRIVACIDADE_CONTATO: ${{ vars.PRIVACIDADE_CONTATO }}
          PRIVACIDADE_REGIAO_DADOS: ${{ vars.PRIVACIDADE_REGIAO_DADOS }}
        run: python -m app.build_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  publicar:
    needs: coletar-e-construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  dados-do-site-novo:
    needs: coletar-e-construir
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Vazio (secret ausente) = usa o GITHUB_TOKEN. Com a chave, o push vai por SSH e passa pela exceção da regra da main.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar a coleta
        uses: actions/download-artifact@v4
        with:
          name: coleta-gupy-${{ github.run_id }}
          path: data/raw/

      - name: Gerar vagas e trilhas do site novo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m app.exportar_json
          # Se a Groq falhar (modelo descontinuado, chave inválida, cota), as trilhas saem por regras em vez de quebrar o job.
          python -m trilhas.gerar || python -m trilhas.gerar --provedor nenhum

      - name: Commitar se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/data apps/web/src/dados
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados do site novo."
          else
            git commit -m "chore(dados): atualiza vagas e trilhas do site novo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
