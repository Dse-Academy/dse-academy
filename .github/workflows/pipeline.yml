# Coleta semanal de vagas e atualização dos dados do site (apps/web).
#
# 1. job "coletar": roda os testes, coleta as vagas da Gupy e guarda o JSON bruto como artefato (90 dias).
# 2. job "dados-do-site-novo": regenera apps/web/data/ (vagas e trilhas) a partir da coleta e commita no main.
#    A Vercel publica o site sozinha a cada commit. Opcional: o segredo GROQ_API_KEY (Settings > Secrets > Actions)
#    faz o modelo aberto organizar as trilhas; sem ele, as trilhas saem por regras.
#
# O site antigo (HTML/JS estático, publicado no GitHub Pages) foi aposentado: o site novo cobre todas as funcionalidades.
# O código dele continua no histórico do Git.
#
# Proteção da main: a main exige PR e checks verdes, então o commit de dados precisa de uma identidade com bypass.
# O job usa a chave de deploy do secret DEPLOY_KEY (permitida como bypass na regra da main). Sem o secret, o checkout
# cai no GITHUB_TOKEN, que não tem permissão de escrita aqui e o commit seria recusado.
#
# Se a coleta vier suspeita (poucas vagas) ou os testes falharem, nada é atualizado:
# o site continua com os dados anteriores e o GitHub avisa por e-mail.

name: Coleta e publicação

on:
  schedule:
    # Sexta às 05:00 UTC = 02:00 em Brasília (madrugada de quinta para sexta).
    # O GitHub pode atrasar execuções agendadas em alguns minutos.
    - cron: "0 5 * * 5"
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: read # o commit de dados usa a chave de deploy, não o GITHUB_TOKEN

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Coletar vagas da Gupy
        run: python -m ingestion.gupy --minimo 200

      - name: Guardar o JSON bruto da coleta (90 dias)
        uses: actions/upload-artifact@v7
        with:
          name: coleta-gupy-${{ github.run_id }}
          path: data/raw/
          retention-days: 90

  dados-do-site-novo:
    needs: coletar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # A chave de deploy permite o push na main protegida (exceção da regra). Sem o secret, usa o GITHUB_TOKEN.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar a coleta
        uses: actions/download-artifact@v8
        with:
          name: coleta-gupy-${{ github.run_id }}
          path: data/raw/

      - name: Gerar vagas e trilhas do site novo
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m app.exportar_json
          # Se a Groq falhar (modelo descontinuado, chave inválida, cota), as trilhas saem por regras em vez de quebrar o job.
          python -m trilhas.gerar || python -m trilhas.gerar --provedor nenhum

      - name: Commitar se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/data apps/web/src/dados
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados do site novo."
          else
            git commit -m "chore(dados): atualiza vagas e trilhas do site novo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
