# Repete o caminho do gateway do Supabase: /rest/v1/... chega ao PostgREST como /...
server {
  listen 80;

  location /rest/v1/ {
    proxy_pass http://postgrest:3000/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location = /saude {
    return 200 "ok";
  }
}
